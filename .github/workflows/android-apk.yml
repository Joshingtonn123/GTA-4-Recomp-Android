name: Android APK

on:
  push:
    branches: [main, Testing]
  pull_request:
    branches: [main, Testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify submodule metadata
        run: git submodule status --recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.4" "ndk;27.2.12479018"

      - name: Build debug APK
        working-directory: os/android
        env:
          LIBERTY_RECOMP_STRICT_DEP_PATCHES: 'OFF'
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liberty-recomp-debug-apk
          path: os/android/app/build/outputs/apk/debug/*.apk
